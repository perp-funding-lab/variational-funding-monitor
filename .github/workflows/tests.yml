name: tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "site/*.js", "site/*.html", "config/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "site/**", "config/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/js/
