name: collect

# 起動: 主系は Cloudflare Worker からの workflow_dispatch(8,18,28,38,48,58 分)。schedule は保険(30 分ごと、正時と 58 分を避ける。
# 直前 12 分以内に成功していれば何もしないので、Worker が生きている間はコミットを増やさない)。
on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: "予定時刻(ISO 8601 UTC。Worker が付ける。手動なら空)"
        required: false
        default: ""
  schedule:
    - cron: "13,43 * * * *"

# 同じワークフローの同時実行を防ぐ(GitHub は実行中 1 + 待機 1 まで。3 つ目が来ると待機中の方が取り消される)。
# hl.yml / archive.yml は別グループ(触るファイルが重ならず、push が競合しても rebase で解決できる)
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      skipped: ${{ steps.collect.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # data/archive(月締めの .csv.gz)は収集には要らないので持たない(帯域の節約)
          sparse-checkout: |
            .github
            src
            config
            site
            data/obs
            data/funding
            data/snapshots
            data/runs
            data/hl
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: collect
        id: collect
        # 取得に失敗してもサイトは作り直す(ページに警告が出る)。失敗は実行ログに残る。
        # schedule(保険)は、Worker 経由の収集が 12 分以内に成功していれば何もしない(skipped=true)
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python -m vfm collect --trigger "${{ github.event_name }}" \
            --scheduled "${{ github.event.inputs.scheduled }}" \
            --slots "${{ github.event_name == 'schedule' && '13,43' || '8,18,28,38,48,58' }}" \
            --skip-if-fresh "${{ github.event_name == 'schedule' && '720' || '0' }}"

      - name: commit and push data
        if: steps.collect.outputs.skipped != 'true'
        run: |
          git config user.name "perp-funding-lab-collector[bot]"   # コミットの名義は GitHub App の bot に揃える
          git config user.email "350662295+perp-funding-lab-collector[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ) (${{ github.event_name }})"
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push failed (try $i), rebasing"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "rebase conflict"; exit 1; }
            sleep $((i * 5))
          done
          echo "push failed after retries"; exit 1

      - name: build site data
        if: steps.collect.outputs.skipped != 'true'
        env:
          PYTHONPATH: src
        run: python -m vfm build --out site

      - uses: actions/configure-pages@v5
        if: steps.collect.outputs.skipped != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.collect.outputs.skipped != 'true'
        with:
          path: site

  # デプロイは別ジョブ: 何もしなかった保険の回(skipped)では Pages のデプロイ記録を作らない
  deploy:
    needs: collect
    if: needs.collect.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
