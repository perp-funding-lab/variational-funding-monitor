name = "perp-funding-lab-dispatch"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 公開 URL は作らない(workers.dev のサブドメインはアカウント名を含むので、なおさら出さない)。cron から dispatch するだけ
workers_dev = false
preview_urls = false

# src/index.js の CRON_WORKFLOW と 1 文字違わず一致させること
# 注意: Workers のアカウント全体の cron 数には上限がある。デプロイ後に登録されたか必ず API で確認する
#       (超過すると登録だけ拒否され、Actions の保険 schedule だけで動く状態になる)
[triggers]
crons = [
  "8,18,28,38,48,58 * * * *", # collect.yml(10 分ごと。58 分は支払直前の観測)
]

# 秘密ではない設定値。秘密鍵だけ secret(GITHUB_APP_PRIVATE_KEY、PKCS#8)で別に登録する
[vars]
GITHUB_REPO = "perp-funding-lab/variational-funding-monitor"
GITHUB_REF = "main"
WORKFLOW_FILE = "collect.yml"
GITHUB_APP_ID = "5553022"
GITHUB_APP_INSTALLATION_ID = "177152383"

[observability]
enabled = true
